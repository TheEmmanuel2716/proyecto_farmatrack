services:
  kafka:
    image: docker.io/apache/kafka:3.9.1
    container_name: farmatrack-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - farmatrack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: docker.io/library/postgres:16
    container_name: farmatrack-postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: farmatrack
      POSTGRES_USER: farmatrack
      POSTGRES_PASSWORD: farmatrack_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - farmatrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmatrack -d farmatrack"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  inventario-service:
    image: localhost/farmatrack-inventario-service:latest
    build:
      context: ./inventario-service
      dockerfile: Dockerfile
    container_name: farmatrack-inventario-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: farmatrack
      DB_SCHEMA: inventario
      DB_USERNAME: farmatrack
      DB_PASSWORD: farmatrack_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: dev-only-secret-change-me-32-bytes
    ports:
      - "8081:8081"
    networks:
      - farmatrack

  vencimientos-service:
    image: localhost/farmatrack-vencimientos-service:latest
    build:
      context: ./vencimientos-service
      dockerfile: Dockerfile
    container_name: farmatrack-vencimientos-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: farmatrack
      DB_SCHEMA: vencimientos
      DB_USERNAME: farmatrack
      DB_PASSWORD: farmatrack_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: dev-only-secret-change-me-32-bytes
      KAFKA_CONSUMER_GROUP: vencimientos-service-group
    ports:
      - "8082:8082"
    networks:
      - farmatrack

  graphql-gateway:
    image: localhost/farmatrack-graphql-gateway:latest
    build:
      context: ./graphql-gateway
      dockerfile: Dockerfile
    container_name: farmatrack-graphql-gateway
    depends_on:
      - inventario-service
      - vencimientos-service
    environment:
      SERVER_PORT: 8083
      GRAPHIQL_ENABLED: "true"
      INVENTARIO_SERVICE_URL: http://inventario-service:8081
      VENCIMIENTOS_SERVICE_URL: http://vencimientos-service:8082
      JWT_SECRET: dev-only-secret-change-me-32-bytes
    ports:
      - "8083:8083"
    networks:
      - farmatrack

  frontend:
    image: localhost/farmatrack-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmatrack-frontend
    depends_on:
      - graphql-gateway
    ports:
      - "3000:80"
    networks:
      - farmatrack

volumes:
  kafka_data:
  postgres_data:

networks:
  farmatrack:
    driver: bridge
